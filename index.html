<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner PDF Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="app-container">
        
        <!-- HEADER PERMANENTE -->
        <header class="app-header">
            <h5 class="m-0 fw-bold"><i class="bi bi-file-earmark-pdf-fill text-danger"></i> PDF Scanner</h5>
            <!-- Selector de Formato siempre visible -->
            <select id="doc-format" class="form-select form-select-sm w-auto fw-bold shadow-sm">
                <option value="a4" selected>Tamaño A4</option>
                <option value="letter">Tamaño Carta</option>
            </select>
        </header>

        <!-- ÁREA DE TRABAJO -->
        <div class="content-area">
            
            <!-- ESTADO INICIAL / PANEL DE ACCIONES -->
            <div id="home-state" class="text-center mt-4 px-3">
                <p class="text-muted small mb-4">Selecciona cómo deseas agregar páginas a tu documento.</p>
                <div class="d-grid gap-3">
                    <button class="btn btn-primary btn-lg rounded-4 shadow-sm py-3 fw-bold" id="btn-open-camera">
                        <i class="bi bi-camera-fill fs-4 d-block mb-1"></i> Iniciar Escáner
                    </button>
                    <button class="btn btn-outline-dark btn-lg rounded-4 border-2 py-3 fw-bold" id="btn-import" onclick="document.getElementById('file-upload').click()">
                        <i class="bi bi-file-earmark-plus fs-4 d-block mb-1"></i> Añadir Archivo (PDF/Foto)
                    </button>
                    <input type="file" id="file-upload" class="d-none" accept="image/*, application/pdf" multiple>
                </div>
            </div>

            <!-- VISOR DE CÁMARA (Oculto por defecto) -->
            <section id="camera-section" class="camera-section d-none">
                <button id="btn-close-camera" class="btn-close-cam"><i class="bi bi-chevron-down"></i> Cerrar</button>
                <video id="video-feed" autoplay playsinline></video>
                <div id="scanner-guide">
                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>
                </div>
                <img id="photo-preview" alt="Vista previa" class="d-none">
                
                <div class="camera-controls" id="controls-capture">
                    <button class="icon-btn" id="btn-switch" title="Girar cámara"><i class="bi bi-arrow-repeat"></i></button>
                    <button class="capture-btn" id="btn-capture"></button>
                    <div style="width: 45px;"></div> <!-- Espaciador invisible -->
                </div>

                <div class="camera-controls d-none" id="controls-review">
                    <button class="icon-btn bg-danger text-white border-0" id="btn-retake"><i class="bi bi-x-lg"></i></button>
                    <button class="icon-btn bg-success text-white border-0" id="btn-accept"><i class="bi bi-check-lg"></i></button>
                </div>
            </section>

            <!-- GALERÍA DE PÁGINAS -->
            <section id="gallery-section" class="gallery-section d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small fw-bold"><i class="bi bi-grip-horizontal"></i> Páginas agregadas</span>
                </div>
                <div id="gallery" class="row g-2 pb-5">
                    <!-- Miniaturas se inyectan aquí -->
                </div>
            </section>
        </div>

        <!-- FOOTER: SIEMPRE VISIBLE SI HAY PÁGINAS -->
        <footer id="action-footer" class="action-footer d-none">
            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <span class="fw-bold text-dark small">Páginas listas:</span>
                <span id="page-counter" class="badge bg-dark rounded-pill">0 / 20</span>
            </div>
            <button id="btn-finish" class="btn btn-danger w-100 py-3 rounded-pill fw-bold shadow">
                <i class="bi bi-magic me-2"></i> Crear PDF
            </button>
        </footer>

        <!-- CANVAS Y OVERLAYS -->
        <canvas id="canvas" class="d-none"></canvas>
        <div id="loading-overlay">
            <div class="spinner-border text-light" role="status"></div>
            <p class="mt-3 text-white fw-bold" id="loading-text">Procesando...</p>
        </div>

        <!-- MODAL GENERAR PDF (Ahora pregunta el nombre) -->
        <div class="modal fade" id="settingsModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content rounded-4 border-0 shadow">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold">Guardar PDF</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Campo Nombre de Archivo -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">Nombre del archivo:</label>
                            <input type="text" id="pdf-filename" class="form-control form-control-lg bg-light" value="Mi_Documento" placeholder="Ej. Contrato_Alquiler">
                        </div>

                        <label class="form-label fw-bold text-muted small">Márgenes de página:</label>
                        <div class="list-group">
                            <label class="list-group-item d-flex gap-2 p-3 border-0 rounded-3 mb-2 bg-light">
                                <input class="form-check-input flex-shrink-0" type="radio" name="marginOptions" value="0" checked>
                                <span><strong class="d-block">Sin margen</strong><small class="text-muted">La imagen llena la hoja.</small></span>
                            </label>
                            <label class="list-group-item d-flex gap-2 p-3 border-0 rounded-3 mb-2 bg-light">
                                <input class="form-check-input flex-shrink-0" type="radio" name="marginOptions" value="10">
                                <span><strong class="d-block">Estándar (10mm)</strong><small class="text-muted">Borde formal blanco.</small></span>
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button class="btn btn-dark w-100 py-3 rounded-pill fw-bold" id="btn-generate-pdf">
                            <i class="bi bi-download me-2"></i> Generar y Descargar
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="js/app.js"></script>
</body>
</html>
